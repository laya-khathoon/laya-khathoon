name: Generate contribution snake

on:
  schedule:
    - cron: "17 6,18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate the snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: laya-khathoon
          outputs: dist/github-contribution-grid-snake.svg?color_snake=#1A1A1A&color_dots=#F1E7D2,#E3C188,#D9A45F,#C98443,#B4632A
      - name: Push the svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
